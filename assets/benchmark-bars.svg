<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
  <title id="title">Skill Catalog Sorter benchmark savings</title>
  <desc id="desc">Startup metadata saves 72.6 percent, core skill bodies save 78.9 percent, and average task loading saves 96 percent.</desc>
  <rect width="900" height="390" rx="18" fill="#101827"/>
  <text x="48" y="58" fill="#f8fafc" font-family="Arial, sans-serif" font-size="27" font-weight="700">Context savings</text>
  <text x="48" y="86" fill="#94a3b8" font-family="Arial, sans-serif" font-size="15">Measured against the current 100-skill installation</text>
  <g font-family="Arial, sans-serif" font-size="16" font-weight="700">
    <text x="48" y="143" fill="#cbd5e1">Startup metadata</text>
    <text x="48" y="211" fill="#cbd5e1">Core skill bodies</text>
    <text x="48" y="279" fill="#cbd5e1">Average task load</text>
  </g>
  <g fill="#1e293b">
    <rect x="230" y="122" width="550" height="28" rx="14"/>
    <rect x="230" y="190" width="550" height="28" rx="14"/>
    <rect x="230" y="258" width="550" height="28" rx="14"/>
  </g>
  <rect x="230" y="122" width="399.3" height="28" rx="14" fill="#00d084"/>
  <rect x="230" y="190" width="433.95" height="28" rx="14" fill="#00b8ff"/>
  <rect x="230" y="258" width="528" height="28" rx="14" fill="#ffb000"/>
  <g fill="#f8fafc" font-family="Arial, sans-serif" font-size="18" font-weight="700">
    <text x="800" y="144">72.6%</text>
    <text x="800" y="212">78.9%</text>
    <text x="800" y="280">96.0%</text>
  </g>
  <g fill="#64748b" font-family="Arial, sans-serif" font-size="13">
    <text x="230" y="322">0%</text>
    <text x="495" y="322">50%</text>
    <text x="755" y="322">100%</text>
  </g>
  <text x="48" y="358" fill="#64748b" font-family="Arial, sans-serif" font-size="13">Estimated with 4 characters per token</text>
</svg>
